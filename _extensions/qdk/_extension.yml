# qdk-html is a native Quarto format extension; consumer content and runtime stay native.
title: Quarto Design Kit
author: arfiligol
version: 0.1.0
quarto-required: ">=1.10.18"
contributes:
  formats:
    html:
      theme:
        light: [default, qdk.scss]
        dark: [default, qdk.scss, qdk-dark.scss]
      theme-toggle: true
      toc: true
      page-layout: article
      grid:
        sidebar-width: 240px
        body-width: 630px
        margin-width: 240px
        gutter-width: 1.5rem
