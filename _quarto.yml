project:
  type: website
  output-dir: _site

website:
  title: Quarto Design Kit
  search: false
  navbar:
    left:
      - href: index.qmd
        text: Gallery
      - href: components.qmd
        text: Components
      - href: install.qmd
        text: Install
      - href: credits.qmd
        text: Credits
  sidebar:
    - id: gallery
      title: "Pages"
      style: docked
      collapse-level: 2
      contents:
        - text: "Overview"
          href: index.qmd
        - text: "Layout"
          href: gallery/layout.qmd
        - text: "Rhythm"
          href: gallery/rhythm.qmd
        - text: "Callout target"
          href: gallery/callout.qmd
        - text: "CJK specimen"
          href: gallery/cjk.qmd
    - id: components
      title: "Pages"
      style: docked
      collapse-level: 2
      contents:
        - text: "Overview"
          href: components.qmd
        - text: "Headings"
          href: components/headings.qmd
        - text: "Prose"
          href: components/prose.qmd
        - text: "Callouts"
          href: components/callouts.qmd
        - text: "Code"
          href: components/code.qmd
        - text: "Tables"
          href: components/tables.qmd
        - text: "Mathematics"
          href: components/mathematics.qmd
        - text: "Figures and groups"
          href: components/figures.qmd
        - text: "Saved notebook output"
          href: notebook-output.qmd
    - id: install
      title: "Pages"
      style: docked
      collapse-level: 2
      contents:
        - text: "Install, customize, and update"
          href: install.qmd
    - id: credits
      title: "Pages"
      style: docked
      collapse-level: 2
      contents:
        - text: "Attribution"
          href: credits.qmd
        - text: "Third-party list"
          href: THIRD_PARTY.md
        - text: "Asset manifest"
          href: ASSET_MANIFEST.md

format:
  qdk-html:
    toc: true
    toc-title: "Sections"
    toc-location: right
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
